# Local MongoDB for development and tests of the worker: single-node replica set, no authentication,
# published on 127.0.0.1 only. Never use it for anything but local work.
#   docker compose -f einvoicing-worker/compose.yaml up -d --wait
#   FLOOD_CLOUD_TEST_MONGO_URI=mongodb://127.0.0.1:27028/?directConnection=true
# Host port 27028 (the backend uses 27027), so both stacks can run together.
# The default image is 8.2 because 8.0 does not start on Docker for Mac (SERVER-121912);
# Atlas runs 8.0, but CI uses this default too: 8.0 does not start on the recent kernels of the GitHub runners.
# Images are pinned by digest (multi-arch index): update tag and digest together.
services:
  mongo:
    image: ${FLOOD_CLOUD_MONGO_IMAGE:-mongo:8.2.12@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3}
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27028:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status().myState === 1 ? quit(0) : quit(1) }
          catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }); quit(1) }"
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 5s
volumes:
  mongo-data:
