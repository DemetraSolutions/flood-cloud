# Identity of the e-invoicing worker pod. Deliberately its own account, not the backend's: the
# worker will hold the private key that decrypts provider credentials and must not inherit
# anything the backend is granted. It calls no Google Cloud API, so there is NO
# iam.gke.io/gcp-service-account annotation (no Workload Identity binding to create) and no
# Kubernetes API token is mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flood-cloud-einvoicing-worker
  namespace: flood-v2
  labels:
    app.kubernetes.io/name: flood-cloud-einvoicing-worker
    app.kubernetes.io/part-of: flood-cloud
    app.kubernetes.io/component: einvoicing-worker
automountServiceAccountToken: false
