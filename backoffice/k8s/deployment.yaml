apiVersion: apps/v1
kind: Deployment
metadata:
  name: flood-cloud-backoffice
  namespace: flood-v2
  labels:
    app.kubernetes.io/name: flood-cloud-backoffice
    app.kubernetes.io/part-of: flood-cloud
    app.kubernetes.io/component: backoffice
spec:
  # One replica (user decision of 2026-11-24): a stateless static server, no session or data here.
  # A pod restart or a node drain makes the portal unreachable for a few seconds; the rolling
  # update below starts the new pod before stopping the old one.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: flood-cloud-backoffice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flood-cloud-backoffice
        app.kubernetes.io/part-of: flood-cloud
        app.kubernetes.io/component: backoffice
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backoffice
          # Repository flood-cloud-backoffice (new: distinct from the images of the legacy platform).
          # TODO_TAG is replaced by the pipeline with the tag of the built image (commit SHA).
          image: europe-west8-docker.pkg.dev/flood-software/floodsoftware/flood-cloud-backoffice:TODO_TAG
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: flood-cloud-backoffice-config
            # The backoffice currently has no secrets, so the Secret is optional.
            - secretRef:
                name: flood-cloud-backoffice-secrets
                optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
