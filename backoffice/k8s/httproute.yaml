apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flood-cloud-backoffice
  namespace: flood-v2
  labels:
    app.kubernetes.io/name: flood-cloud-backoffice
    app.kubernetes.io/part-of: flood-cloud
    app.kubernetes.io/component: backoffice
spec:
  parentRefs:
    - name: flood-gateway
      # The shared Gateway lives in the default namespace and admits routes
      # from every namespace (allowedRoutes.namespaces.from: All).
      namespace: default
      # Only the HTTPS listener: plain HTTP is redirected by httproute-redirect.yaml.
      sectionName: https
  hostnames:
    - portal.floodsoftware.cloud
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: flood-cloud-backoffice
          port: 80
