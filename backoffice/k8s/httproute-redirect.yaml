# Redirects plain HTTP (listener "http", port 80, of flood-gateway) to HTTPS with 301.
# The application route (httproute.yaml) is attached only to the "https" listener.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flood-cloud-backoffice-redirect
  namespace: flood-v2
  labels:
    app.kubernetes.io/name: flood-cloud-backoffice
    app.kubernetes.io/part-of: flood-cloud
    app.kubernetes.io/component: backoffice
spec:
  parentRefs:
    - name: flood-gateway
      namespace: default
      sectionName: http
  hostnames:
    - portal.floodsoftware.cloud
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
