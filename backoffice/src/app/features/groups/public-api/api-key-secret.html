<fc-dialog
  [heading]="'PUBLIC_API.SECRET.TITLE' | t"
  [open]="open()"
  (openChange)="open.set($event)"
  (closed)="onClosed()"
>
  @if (secret(); as value) {
    <p>{{ 'PUBLIC_API.SECRET.INTRO' | t: { name: name() } }}</p>
    <p class="warning" role="note">{{ 'PUBLIC_API.SECRET.WARNING' | t }}</p>
    <p class="secret">
      <span class="visually-hidden">{{ 'PUBLIC_API.SECRET.LABEL' | t }}</span>
      <code>{{ value }}</code>
    </p>
    <p class="status" role="status" aria-live="polite">{{ announcement() }}</p>
    <fc-checkbox
      [label]="'PUBLIC_API.SECRET.SAVED_CHECK' | t"
      [hint]="'PUBLIC_API.SECRET.CLOSE_HINT' | t"
      [checked]="acknowledged()"
      (checkedChange)="acknowledged.set($event)"
    />
  }
  <button
    fcDialogActions
    fc-button
    variant="secondary"
    [disabled]="secret() === null"
    (click)="copy()"
  >
    {{ 'PUBLIC_API.SECRET.COPY' | t }}
  </button>
  <button fcDialogActions fc-button [disabled]="!acknowledged()" (click)="open.set(false)">
    {{ 'COMMON.CLOSE' | t }}
  </button>
</fc-dialog>
