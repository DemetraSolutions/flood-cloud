<ul class="rows" [attr.aria-describedby]="error() ? errorId : null">
  @for (entry of rows(); track $index) {
    <li>
      <div class="grid">
        <fc-text-field
          autocomplete="off"
          [label]="'PRODUCTS.BARCODES.VALUE' | t: { number: entry.index + 1 }"
          [value]="entry.row.value"
          [format]="strip"
          [disabled]="disabled()"
          [error]="message(entry.issues.value)"
          (valueChange)="change(entry.index, { value: $event })"
        />
        @if (warehouse()) {
          <fc-text-field
            inputmode="decimal"
            autocomplete="off"
            [label]="'PRODUCTS.BARCODES.LOAD_QUANTITY' | t: { number: entry.index + 1 }"
            [value]="entry.row.loadQuantity"
            [disabled]="disabled()"
            [error]="message(entry.issues.loadQuantity)"
            (valueChange)="change(entry.index, { loadQuantity: $event })"
          />
          <fc-text-field
            autocomplete="off"
            [label]="'PRODUCTS.BARCODES.UNLOAD_QUANTITY' | t: { number: entry.index + 1 }"
            [value]="entry.unload"
            [readonly]="true"
          />
        }
        <fc-text-field
          inputmode="decimal"
          autocomplete="off"
          [label]="'PRODUCTS.BARCODES.SALE_QUANTITY' | t: { number: entry.index + 1 }"
          [value]="entry.row.saleQuantity"
          [disabled]="disabled()"
          [error]="message(entry.issues.saleQuantity)"
          (valueChange)="change(entry.index, { saleQuantity: $event })"
        />
      </div>
      <fc-product-warning-note [groupId]="groupId()" [warning]="entry.warning" />
      @if (!disabled()) {
        <div class="actions">
          <button
            fc-button
            variant="ghost"
            type="button"
            [attr.aria-label]="'PRODUCTS.BARCODES.REMOVE_LABEL' | t: { number: entry.index + 1 }"
            (click)="remove(entry.index)"
          >
            {{ 'PRODUCTS.REMOVE' | t }}
          </button>
        </div>
      }
    </li>
  } @empty {
    <li class="note">{{ 'PRODUCTS.BARCODES.EMPTY' | t }}</li>
  }
</ul>
@if (!disabled()) {
  <div class="actions">
    <button fc-button variant="secondary" type="button" [disabled]="value().length >= limit" (click)="add()">
      {{ 'PRODUCTS.BARCODES.ADD' | t }}
    </button>
  </div>
}
@if (error()) {
  <p class="problem" [id]="errorId" role="alert">{{ error() }}</p>
}
