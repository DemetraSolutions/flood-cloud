<section aria-labelledby="einvoicing-heading">
  <div class="heading" role="heading" [attr.aria-level]="headingLevel()" id="einvoicing-heading">
    {{ 'EINVOICING.CARD_TITLE' | t }}
  </div>
  <p class="note">{{ ownerKey() | t }}</p>

  @if (failed()) {
    <fc-error-state
      [title]="'EINVOICING.LOAD_ERROR' | t"
      [message]="loadErrorMessage()"
      [requestId]="loadError()?.requestId ?? null"
      (retry)="reload()"
    />
  } @else if (account(); as current) {
    @if (stale()) {
      <section class="notice" role="alert">
        <p>{{ 'EINVOICING.STALE' | t }}</p>
        <button fc-button variant="secondary" (click)="reload()">
          {{ 'EINVOICING.RELOAD' | t }}
        </button>
      </section>
    }
    <form novalidate (submit)="onSubmit($event)">
      @if (failure(); as message) {
        <fc-form-error [message]="message" />
      }
      <fc-text-field
        [label]="'EINVOICING.HUB' | t"
        [value]="current.hub"
        [readonly]="true"
        [hint]="'EINVOICING.HUB_HINT' | t"
      />
      <fc-checkbox
        [formField]="accountForm.enabled"
        [label]="'EINVOICING.ENABLED' | t"
        [error]="error(accountForm.enabled)"
      />
      <fc-text-field
        [formField]="accountForm.username"
        inputId="aruba-username"
        fieldName="aruba-username"
        ignorePasswordManagers
        autocomplete="off"
        autocapitalize="none"
        spellcheck="false"
        [label]="'EINVOICING.USERNAME' | t"
        [error]="error(accountForm.username)"
        (blurred)="accountForm.username().markAsTouched()"
      />
      <fc-text-field
        [formField]="accountForm.password"
        inputId="aruba-password"
        fieldName="aruba-password"
        ignorePasswordManagers
        type="password"
        autocomplete="new-password"
        [label]="'EINVOICING.PASSWORD' | t"
        [hint]="passwordHint()"
        [error]="error(accountForm.password)"
        (blurred)="accountForm.password().markAsTouched()"
      />
      <fc-text-field
        [formField]="accountForm.maxPerHour"
        inputmode="numeric"
        autocomplete="off"
        [label]="'EINVOICING.MAX_PER_HOUR' | t"
        [hint]="'EINVOICING.MAX_PER_HOUR_HINT' | t"
        [error]="error(accountForm.maxPerHour)"
        (blurred)="accountForm.maxPerHour().markAsTouched()"
      />
      <fc-text-field
        [formField]="accountForm.maxPerYear"
        inputmode="numeric"
        autocomplete="off"
        [label]="'EINVOICING.MAX_PER_YEAR' | t"
        [hint]="'EINVOICING.MAX_PER_YEAR_HINT' | t"
        [error]="error(accountForm.maxPerYear)"
        (blurred)="accountForm.maxPerYear().markAsTouched()"
      />
      <div class="actions">
        <button fc-button type="submit" [loading]="submitting()">{{ 'COMMON.SAVE' | t }}</button>
        @if (current.configured) {
          <button fc-button type="button" variant="danger" (click)="confirmOpen.set(true)">
            {{ 'EINVOICING.REMOVE' | t }}
          </button>
        }
      </div>
    </form>
  } @else if (loading()) {
    <p role="status">{{ 'COMMON.LOADING' | t }}</p>
  }

  <fc-confirm-dialog
    [alert]="true"
    [heading]="'EINVOICING.REMOVE_TITLE' | t"
    [message]="'EINVOICING.REMOVE_CONFIRM' | t"
    [confirmLabel]="'EINVOICING.REMOVE' | t"
    [danger]="true"
    [busy]="removing()"
    [open]="confirmOpen()"
    (openChange)="confirmOpen.set($event)"
    (confirmed)="onRemove()"
  />
</section>
