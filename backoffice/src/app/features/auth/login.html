<main class="page">
  <section class="card">
    <h1>{{ 'AUTH.LOGIN.TITLE' | t }}</h1>
    <p class="intro">{{ 'APP.NAME' | t }}</p>
    <form novalidate (submit)="onSubmit($event)">
      @if (failure(); as message) {
        <fc-form-error [message]="message" />
      }
      <fc-text-field
        [formField]="loginForm.username"
        [label]="'AUTH.LOGIN.USERNAME' | t"
        autocomplete="username"
        autocapitalize="none"
        spellcheck="false"
        [error]="error(loginForm.username)"
        (blurred)="loginForm.username().markAsTouched()"
      />
      <fc-text-field
        [formField]="loginForm.password"
        [label]="'AUTH.LOGIN.PASSWORD' | t"
        [type]="showPassword() ? 'text' : 'password'"
        autocomplete="current-password"
        [error]="error(loginForm.password)"
        (blurred)="onPasswordBlur()"
      />
      <fc-checkbox
        [label]="'AUTH.LOGIN.SHOW_PASSWORD' | t"
        [checked]="showPassword()"
        (checkedChange)="showPassword.set($event)"
      />
      <button fc-button type="submit" [loading]="submitting()">
        {{ 'AUTH.LOGIN.SUBMIT' | t }}
      </button>
    </form>
  </section>
</main>
