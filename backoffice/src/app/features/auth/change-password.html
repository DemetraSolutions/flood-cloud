<h1>{{ 'AUTH.CHANGE_PASSWORD.TITLE' | t }}</h1>
<p>
  @if (mandatory()) {
    {{ 'AUTH.CHANGE_PASSWORD.INTRO_REQUIRED' | t }}
  } @else {
    {{ 'AUTH.CHANGE_PASSWORD.INTRO' | t }}
  }
</p>
<form novalidate (submit)="onSubmit($event)">
  @if (failure(); as message) {
    <fc-form-error [message]="message" />
  }
  <fc-text-field
    [formField]="passwordForm.currentPassword"
    type="password"
    [label]="'AUTH.CHANGE_PASSWORD.CURRENT' | t"
    autocomplete="current-password"
    [error]="error(passwordForm.currentPassword)"
    (blurred)="passwordForm.currentPassword().markAsTouched()"
  />
  <fc-text-field
    [formField]="passwordForm.newPassword"
    type="password"
    [label]="'AUTH.CHANGE_PASSWORD.NEW' | t"
    autocomplete="new-password"
    [hint]="'AUTH.CHANGE_PASSWORD.POLICY' | t: { min: minLength, max: maxLength }"
    [error]="error(passwordForm.newPassword)"
    (blurred)="passwordForm.newPassword().markAsTouched()"
  />
  <fc-text-field
    [formField]="passwordForm.confirmPassword"
    type="password"
    [label]="'AUTH.CHANGE_PASSWORD.CONFIRM' | t"
    autocomplete="new-password"
    [error]="error(passwordForm.confirmPassword)"
    (blurred)="passwordForm.confirmPassword().markAsTouched()"
  />
  <div class="actions">
    <button fc-button type="submit" [loading]="submitting()">
      {{ 'AUTH.CHANGE_PASSWORD.SUBMIT' | t }}
    </button>
    @if (!mandatory()) {
      <a routerLink="/profile">{{ 'COMMON.CANCEL' | t }}</a>
    }
  </div>
</form>
