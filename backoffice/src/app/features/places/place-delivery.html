<form novalidate (submit)="$event.preventDefault()">
  <fc-place-fields block="delivery" [only]="orders" />
  <fc-rows-editor
    [rows]="rows"
    [columns]="columns()"
    [legend]="'PLACES.DELIVERY.COSTS' | t"
    [addLabel]="'PLACES.DELIVERY.ADD_COST' | t"
    [max]="max"
    (add)="add()"
    (remove)="remove($event)"
  />
  <fc-place-fields block="delivery" [only]="area" />
  @if (state.canWrite()) {
    <fc-coordinates-lookup
      [groupId]="state.groupId()"
      [placeId]="state.placeId()"
      [address]="address()"
      (located)="state.setDeliveryCoordinates($event)"
    />
  }
  <fc-keyed-values
    section="delivery"
    prop="minAmount"
    type="number"
    [keys]="state.currencies()"
    [legend]="'PLACES.DELIVERY.MIN_AMOUNT' | t"
    [labelOf]="currencyLabel"
  />
</form>
