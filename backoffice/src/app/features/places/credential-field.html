<div class="credential" role="group" [attr.aria-label]="label()">
  <span class="credential-label">{{ label() }}</span>
  <span class="credential-state">
    @if (clearing()) {
      {{ 'PLACES.CREDENTIAL.REMOVING' | t }}
    } @else if (isSet()) {
      {{ 'PLACES.CREDENTIAL.SET' | t }}
    } @else {
      {{ 'PLACES.CREDENTIAL.NOT_SET' | t }}
    }
  </span>
  @if (editing()) {
    <fc-text-field
      type="password"
      autocomplete="new-password"
      [formField]="credential().value"
      [label]="'PLACES.CREDENTIAL.NEW_VALUE' | t: { label: label() }"
      [error]="error()"
    />
  }
  @if (!disabled()) {
    <div class="row-actions">
      @if (editing()) {
        <button fc-button variant="secondary" (click)="cancel()">
          {{ 'COMMON.CANCEL' | t }}
        </button>
      } @else if (clearing()) {
        <button fc-button variant="secondary" (click)="keep()">
          {{ 'PLACES.CREDENTIAL.KEEP' | t }}
        </button>
      } @else {
        <button fc-button variant="secondary" (click)="change()">
          {{ (isSet() ? 'PLACES.CREDENTIAL.CHANGE' : 'PLACES.CREDENTIAL.SET_NEW') | t }}
        </button>
        @if (isSet()) {
          <button fc-button variant="secondary" (click)="remove()">
            {{ 'PLACES.CREDENTIAL.REMOVE' | t }}
          </button>
        }
      }
    </div>
  }
</div>
