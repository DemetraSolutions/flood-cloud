<form novalidate (submit)="$event.preventDefault()">
  <fc-place-fields block="tables" />
  <fc-rows-editor
    [rows]="rows"
    [columns]="columns()"
    [legend]="'PLACES.TABLES.TIPS' | t"
    [addLabel]="'PLACES.TABLES.ADD_TIP' | t"
    [max]="max"
    (add)="add()"
    (remove)="remove($event)"
  />
  <fc-reasons-editor
    [reasons]="state.form.tables.discountReasons"
    [legend]="'PLACES.TABLES.DISCOUNT_REASONS' | t"
    [addLabel]="'PLACES.TABLES.ADD_REASON' | t"
    [max]="maxReasons"
    (add)="addReason('discountReasons')"
    (remove)="removeReason('discountReasons', $event)"
  />
  <fc-reasons-editor
    [reasons]="state.form.tables.deleteReasons"
    [legend]="'PLACES.TABLES.DELETE_REASONS' | t"
    [addLabel]="'PLACES.TABLES.ADD_REASON' | t"
    [max]="maxReasons"
    (add)="addReason('deleteReasons')"
    (remove)="removeReason('deleteReasons', $event)"
  />
</form>
