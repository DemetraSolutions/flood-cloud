<form novalidate (submit)="$event.preventDefault()">
  @if (state.isPrivileged()) {
    <fieldset>
      <legend>{{ 'PLACES.PRINTING.TRANSFER' | t }}</legend>
      <p class="note">{{ 'PLACES.PRINTING.TRANSFER_HINT' | t }}</p>
      <div class="row-actions">
        <button fc-button variant="secondary" (click)="export()">
          {{ 'PLACES.PRINTING.EXPORT' | t }}
        </button>
        @if (state.canWrite()) {
          <label class="file">
            <span>{{ 'PLACES.PRINTING.IMPORT' | t }}</span>
            <input type="file" accept=".json,application/json" (change)="import($event)" />
          </label>
        }
      </div>
    </fieldset>
  }
  <fc-place-fields block="printing" />
  <fc-place-save section="printing" />
</form>
