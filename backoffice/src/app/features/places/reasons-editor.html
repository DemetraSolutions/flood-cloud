<fieldset>
  <legend>{{ legend() }}</legend>
  @if (state.fieldError(reasons()); as problem) {
    <p class="problem" role="alert">{{ problem }}</p>
  }
  @if (items().length === 0) {
    <p class="note">{{ 'PLACES.NO_REASONS' | t }}</p>
  }
  <div class="rows">
    @for (item of items(); track $index; let i = $index) {
      <div class="cut">
        <fc-text-field
          [formField]="item"
          [label]="label(i)"
          [error]="state.fieldError(item)"
          (blurred)="item().markAsTouched()"
        />
        @if (state.canWrite()) {
          <button
            fc-button
            variant="ghost"
            [attr.aria-label]="removeLabel(i)"
            (click)="remove.emit(i)"
          >
            {{ 'PLACES.REMOVE' | t }}
          </button>
        }
      </div>
    }
  </div>
  @if (state.canWrite()) {
    <div>
      <button
        fc-button
        variant="secondary"
        [disabled]="items().length >= max()"
        (click)="add.emit()"
      >
        {{ addLabel() }}
      </button>
    </div>
  }
</fieldset>
