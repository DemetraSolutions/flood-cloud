<header class="page-header">
  <h1>{{ 'TRASH.TITLE' | t }}</h1>
</header>
<p class="hint">{{ 'TRASH.HINT' | t }}</p>

@if (isAll()) {
  <form class="filters" role="search" novalidate (submit)="$event.preventDefault()">
    <fc-cross-group-filters
      [showGroup]="active() !== 'groups'"
      [groupId]="groupFilter()"
      [dealerId]="dealerFilter()"
      (filterChange)="onFilter($event)"
    />
  </form>
}

<fc-tab-list
  idPrefix="trash"
  [label]="'TRASH.TABS' | t"
  [tabs]="tabs()"
  [active]="active()"
  (activeChange)="select($event)"
/>

@for (kind of [active()]; track kind) {
  <div
    role="tabpanel"
    tabindex="0"
    [id]="'trash-panel-' + kind"
    [attr.aria-labelledby]="'trash-tab-' + kind"
  >
    <fc-trash-tab
      [kind]="kind"
      [groupId]="ownGroupId()"
      [all]="isAll()"
      [groupFilter]="groupFilter()"
      [dealerFilter]="dealerFilter()"
      [q]="q()"
      [limit]="limit()"
      [cursor]="cursor()"
    />
  </div>
}
