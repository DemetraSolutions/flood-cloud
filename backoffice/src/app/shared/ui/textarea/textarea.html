<div class="field">
  <label class="label" [class.required]="required()" [for]="id">{{ label() }}</label>
  <textarea
    #control
    class="control"
    [id]="id"
    [rows]="rows()"
    [value]="value()"
    [disabled]="disabled()"
    [required]="required()"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (input)="onInput($event)"
    (blur)="blurred.emit()"
  ></textarea>
  @if (hint()) {
    <p class="hint" [id]="hintId">{{ hint() }}</p>
  }
  <div class="error" [id]="errorId" aria-live="polite">
    @if (error()) {
      <fc-icon name="error" />
      <span>{{ error() }}</span>
    }
  </div>
</div>
