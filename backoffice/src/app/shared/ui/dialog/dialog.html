<dialog
  [class.wide]="wide()"
  [attr.role]="alert() ? 'alertdialog' : null"
  [attr.aria-labelledby]="headingId"
  [attr.aria-describedby]="alert() ? bodyId : null"
  (close)="onClose()"
>
  <div class="panel">
    <header>
      <h2 [id]="headingId">{{ heading() }}</h2>
      <button
        fc-icon-button
        icon="close"
        [label]="'COMMON.CLOSE' | t"
        (click)="open.set(false)"
      ></button>
    </header>
    <div class="body" [id]="bodyId"><ng-content /></div>
    <footer><ng-content select="[fcDialogActions]" /></footer>
  </div>
</dialog>
