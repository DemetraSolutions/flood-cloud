# Identity of the backend pods. With GKE Workload Identity the media bucket is reached with the
# token of the GKE metadata server (GCS_AUTH=metadata): no key file in the image or in a Secret.
#
# This Kubernetes service account impersonates the Google service account
# flood-media@flood-software.iam.gserviceaccount.com. One-time binding, outside the repository:
#   gcloud iam service-accounts add-iam-policy-binding \
#     flood-media@flood-software.iam.gserviceaccount.com \
#     --project=flood-software \
#     --role=roles/iam.workloadIdentityUser \
#     --member="serviceAccount:flood-software.svc.id.goog[flood-v2/flood-cloud-backend]"
# Requires Workload Identity enabled on the cluster flood-software and GKE_METADATA on its node
# pools. The Google service account already has access to gs://flood-media.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flood-cloud-backend
  namespace: flood-v2
  labels:
    app.kubernetes.io/name: flood-cloud-backend
    app.kubernetes.io/part-of: flood-cloud
    app.kubernetes.io/component: api
  annotations:
    iam.gke.io/gcp-service-account: flood-media@flood-software.iam.gserviceaccount.com
automountServiceAccountToken: false
