# Local MongoDB for development and tests: single-node replica set (needed for transactions),
# no authentication, published on 127.0.0.1 only. Never use it for anything but local work.
#   docker compose -f backend/compose.yaml up -d --wait
#   FLOOD_CLOUD_TEST_MONGO_URI=mongodb://127.0.0.1:27027/?directConnection=true
# The default image is 8.2 because 8.0 does not start on Docker for Mac (SERVER-121912);
# Atlas runs 8.0, so CI overrides it with FLOOD_CLOUD_MONGO_IMAGE=mongo:8.0.34@sha256:b9924c330a8bbc5800fe9c69f04a84e221eca7b28fd049a0354147d9908fa142.
# Images are pinned by digest (multi-arch index): update tag and digest together.
services:
  mongo:
    image: ${FLOOD_CLOUD_MONGO_IMAGE:-mongo:8.2.12@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3}
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27027:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status().myState === 1 ? quit(0) : quit(1) }
          catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }); quit(1) }"
      interval: 3s
      timeout: 10s
      retries: 30
      start_period: 5s
volumes:
  mongo-data:
