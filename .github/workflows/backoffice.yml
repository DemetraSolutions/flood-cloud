name: backoffice

# Disabled for now (user decision of 2026-11-01): runs only when started by hand.
# To enable, restore the triggers below.
#   push:
#     paths: ["backoffice/**", ".github/workflows/backoffice.yml"]
#   pull_request:
#     paths: ["backoffice/**", ".github/workflows/backoffice.yml"]
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backoffice-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, build, audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backoffice
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.2"
          cache: npm
          cache-dependency-path: backoffice/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test the app (Vitest, coverage thresholds at 100%)
        run: npm test

      - name: Test the static server (coverage thresholds at 100%)
        run: npm run test:server

      - name: Typecheck the static server
        run: npm run typecheck:server

      - name: Build
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Verify registry signatures
        run: npm audit signatures
